name: Deploy JJK Life Wheel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize game filename
        run: |
          set -e
          if [ -f " game.html" ]; then
            if [ -f game.html ]; then rm -f " game.html"; else mv " game.html" game.html; fi
          fi
          test -f game.html
          test -f index.html

      - name: Validate V7 JavaScript
        run: |
          set -e
          node --check core/v7-data.js
          node --check core/v7-app.js
          node --check patches/v5.js
          echo "V7 JavaScript syntax check passed."

      - name: Deployment inventory
        run: |
          ls -lh index.html game.html core/v7-data.js core/v7-app.js patches/v5.js
          echo "game.html size: $(wc -c < game.html) bytes"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
