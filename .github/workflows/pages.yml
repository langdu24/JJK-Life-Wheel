name: Deploy JJK Life Wheel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize game filename (safety net)
        run: |
          set -e
          echo "=== Current root files ==="
          ls -la

          # 如果还存在带前导空格的旧文件名，自动改成干净的 game.html
          if [ -f " game.html" ]; then
            if [ -f game.html ]; then
              echo "Both ' game.html' and 'game.html' exist. Removing the spaced one."
              rm -f " game.html"
            else
              echo "Found ' game.html' with leading space → renaming to game.html"
              mv " game.html" game.html
            fi
          fi

          if [ ! -f game.html ]; then
            echo "ERROR: game.html is missing after normalize step."
            exit 1
          fi

          echo "=== Final check ==="
          ls -lh index.html game.html patches/*.js
          echo "game.html size: $(wc -c < game.html) bytes"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
