name: Deploy JJK Life Wheel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify clean source tree
        run: |
          set -e
          test -f game.html
          test ! -f " game.html"
          test -f index.html
          test -f patches/v5.js
          test -f core/v7-model.js
          test -f core/v7-data.js
          test -f core/v7-app.js
          test -f core/v8-state.js
          test -f core/v8-app.js
          echo "game.html size: $(wc -c < game.html) bytes"

      - name: Normalize source metadata
        run: node scripts/normalize-v7-source.mjs game.html

      - name: Sync extracted battle data mirror
        run: |
          set -e
          rm -rf data/extracted-v7
          node scripts/extract-embedded-data.mjs game.html data/extracted-v7
          test -f data/extracted-v7/manifest.json
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          let count = 0;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.json')) {
                JSON.parse(fs.readFileSync(full, 'utf8'));
                count += 1;
              }
            }
          }
          walk('data/extracted-v7');
          if (!count) throw new Error('no extracted JSON files validated');
          console.log(`validated ${count} extracted JSON files`);
          NODE

      - name: Commit normalized source and extracted data
        run: |
          set -e
          if [ -z "$(git status --porcelain -- game.html data/extracted-v7)" ]; then
            echo "source metadata and extracted data already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game.html data/extracted-v7
            git commit -m "chore: sync source metadata and extracted battle data"
            git push
          fi

      - name: Validate JavaScript
        run: |
          set -e
          node --check core/v7-model.js
          node --check core/v7-data.js
          node --check core/v7-app.js
          node --check core/v8-state.js
          node --check core/v8-app.js
          node --check patches/v5.js
          node --check scripts/normalize-v7-source.mjs
          node --check scripts/extract-embedded-data.mjs

      - name: Run model and runtime tests
        run: |
          set -e
          node tests/v7-model.test.js
          node tests/v8-state.test.js
          node tests/verify-runtime.js

      - name: Deployment inventory
        run: |
          ls -lh index.html game.html core/v7-model.js core/v7-data.js core/v7-app.js core/v8-state.js core/v8-app.js patches/v5.js data/extracted-v7/manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
