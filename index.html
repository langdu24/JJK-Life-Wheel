<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <title>JJK Life Wheel · V8.1</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d0d10;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d0d10}#boot{min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);padding:28px;border:1px solid #33333b;border-radius:22px;background:#17171c;box-shadow:0 20px 80px #0008}.muted{color:#aaaab5;line-height:1.65}.status{margin:22px 0;padding:16px;border-radius:14px;background:#202028}.warn{color:#ffd37a}.spinner{width:26px;height:26px;border:3px solid #444;border-top-color:#eee;border-radius:50%;animation:r 1s linear infinite;margin:14px 0}@keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<section id="boot"><main class="card"><h1>呪 · JJK Life Wheel V8.1</h1><p class="muted">正在载入「命运、抉择与反转术式」……</p><div class="spinner" id="spinner"></div><div class="status" id="status">定位 game.html……</div><p class="muted">V7 负责战斗数值，V8 负责人生状态，V8.1 开始让失败、伤势与治疗真正留下后果。</p></main></section>
<script>
(async()=>{
  const boot=document.getElementById('boot'),status=document.getElementById('status'),spinner=document.getElementById('spinner'),gameUrl='./game.html';
  try{const r=await fetch(gameUrl,{method:'HEAD',cache:'no-store'});if(!r.ok)throw new Error('not found')}catch{spinner.hidden=true;status.className='status warn';status.textContent='没有找到 game.html。';return}
  status.textContent='载入游戏本体、V7 数值核心与 V8.1 人生系统……';
  const frame=document.createElement('iframe');frame.id='game';frame.title='JJK Life Wheel V8.1';frame.src=gameUrl+'?v='+Date.now();frame.allow='clipboard-read; clipboard-write';
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      const load=(src,tag,next)=>{const s=doc.createElement('script');s.src=src+'?v='+Date.now();s.dataset.jjkRuntime=tag;s.onload=()=>next?.();s.onerror=()=>{console.warn('[JJK-Life-Wheel] load failed',src);next?.()};doc.head.appendChild(s)};
      load('./patches/v5.js','flow-v5',()=>
        load('./core/v7-model.js','model-v7',()=>
          load('./core/v7-data.js','data-v7',()=>
            load('./core/v7-app.js','app-v7',()=>
              load('./core/v8-state.js','state-v8',()=>
                load('./core/v8-rct-model.js','rct-model-v8',()=>
                  load('./core/v8-app.js','app-v8',()=>
                    load('./core/v8-rct.js','rct-v8'))))))));
    }catch(err){console.warn('[JJK-Life-Wheel] runtime injection failed',err)}
    boot.remove();
  },{once:true});
  document.body.appendChild(frame);
})();
</script>
</body>
</html>
