<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <title>JJK Life Wheel</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d0d10;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d0d10}#boot{min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);padding:28px;border:1px solid #33333b;border-radius:22px;background:#17171c;box-shadow:0 20px 80px #0008}.muted{color:#aaaab5;line-height:1.65}.status{margin:22px 0;padding:16px;border-radius:14px;background:#202028}.warn{color:#ffd37a}a{color:#d9b8ff}.spinner{width:26px;height:26px;border:3px solid #444;border-top-color:#eee;border-radius:50%;animation:r 1s linear infinite;margin:14px 0}@keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <section id="boot"><main class="card"><h1>呪 · JJK Life Wheel</h1><p class="muted">正在载入当前稳定版与补丁层……</p><div class="spinner" id="spinner"></div><div class="status" id="status">定位游戏文件……</div><p class="muted">仓库：<a href="https://github.com/langdu24/JJK-Life-Wheel">langdu24/JJK-Life-Wheel</a></p></main></section>
<script>
(async()=>{
  const boot=document.getElementById('boot'),status=document.getElementById('status'),spinner=document.getElementById('spinner');
  const candidates=['./game.html','./%20game.html'];
  let gameUrl='';
  for(const candidate of candidates){try{const r=await fetch(candidate,{method:'HEAD',cache:'no-store'});if(r.ok){gameUrl=candidate;break}}catch{}}
  if(!gameUrl){spinner.hidden=true;status.className='status warn';status.textContent='没有找到游戏文件。请确认仓库根目录存在 game.html。';return}
  status.textContent='正在载入游戏……';
  const frame=document.createElement('iframe');frame.id='game';frame.title='JJK Life Wheel';frame.src=gameUrl+'?v='+Date.now();frame.allow='clipboard-read; clipboard-write';
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      const loadPatch=(src,tag,next)=>{const s=doc.createElement('script');s.src=src+'?v='+Date.now();s.dataset.jjkGithubPatch=tag;s.onload=()=>next?.();s.onerror=()=>{console.warn('[JJK-Life-Wheel] patch load failed',src);next?.()};doc.head.appendChild(s)};
      loadPatch('./patches/current.js','current',()=>loadPatch('./patches/v3.js','v3',()=>loadPatch('./patches/v3b.js','v3b',()=>loadPatch('./patches/v4.js','v4'))));
    }catch(err){console.warn('[JJK-Life-Wheel] patch injection failed',err)}
    boot.remove();
  },{once:true});
  document.body.appendChild(frame);
})();
</script>
</body>
</html>
