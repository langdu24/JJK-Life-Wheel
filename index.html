<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <title>JJK Life Wheel</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d0d10;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d0d10}#boot{min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);padding:28px;border:1px solid #33333b;border-radius:22px;background:#17171c;box-shadow:0 20px 80px #0008}.muted{color:#aaaab5;line-height:1.65}.status{margin:22px 0;padding:16px;border-radius:14px;background:#202028}.warn{color:#ffd37a}a{color:#d9b8ff}.spinner{width:26px;height:26px;border:3px solid #444;border-top-color:#eee;border-radius:50%;animation:r 1s linear infinite;margin:14px 0}@keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <section id="boot">
    <main class="card">
      <h1>呪 · JJK Life Wheel</h1>
      <p class="muted">正在载入当前稳定版与补丁层……</p>
      <div class="spinner" id="spinner"></div>
      <div class="status" id="status">读取 <code>game.html</code></div>
      <p class="muted">仓库：<a href="https://github.com/langdu24/JJK-Life-Wheel">langdu24/JJK-Life-Wheel</a></p>
    </main>
  </section>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  const status=document.getElementById('status');
  const spinner=document.getElementById('spinner');
  try{
    const r=await fetch('./game.html',{method:'HEAD',cache:'no-store'});
    if(!r.ok) throw new Error('game.html 尚未上传');
    const frame=document.createElement('iframe');
    frame.id='game';
    frame.title='JJK Life Wheel';
    frame.src='./game.html?v='+Date.now();
    frame.allow='clipboard-read; clipboard-write';
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        const patch=doc.createElement('script');
        patch.src='./patches/current.js?v='+Date.now();
        patch.dataset.jjkGithubPatch='current';
        doc.head.appendChild(patch);
      }catch(err){
        console.warn('[JJK-Life-Wheel] patch injection failed',err);
      }
      boot.remove();
    },{once:true});
    document.body.appendChild(frame);
  }catch(e){
    spinner.hidden=true;
    status.className='status warn';
    status.innerHTML='在线入口与补丁系统已经就绪，但当前稳定版 <code>game.html</code> 还未进入仓库。上传后刷新本页即可直接玩。';
  }
})();
</script>
</body>
</html>
